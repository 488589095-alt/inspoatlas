<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InspoAtlas Logo 方向</title><style>*{box-sizing:border-box}body{margin:0;padding:48px 5vw;color:#edf2ed;background:#090d0c;font:15px/1.5 system-ui,"PingFang SC",sans-serif}h1{font-size:32px;letter-spacing:-.04em;margin:0 0 8px}p{color:#a2ada6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:36px}.card{min-width:0;padding:26px;border:1px solid #354139;border-radius:18px;background:#151c19}.logo{display:grid;place-items:center;min-height:240px;border-radius:12px;background:#0c1210}.logo img{width:168px;height:168px}.sizes{display:flex;align-items:center;gap:18px;margin-top:22px;padding:16px;border:1px solid #354139;border-radius:10px}.sizes img:nth-child(1){width:48px;height:48px}.sizes img:nth-child(2){width:28px;height:28px}.sizes img:nth-child(3){width:20px;height:20px}h2{font-size:18px;margin:20px 0 4px}small{color:#a2ada6}@media(max-width:780px){body{padding:25px}.grid{grid-template-columns:1fr}.logo{min-height:180px}}</style></head><body><h1>InspoAtlas · Logo 方向</h1><p>三种几何方案，沿用当前深色工作台与苔绿色强调色。这里只选视觉方向，细节将在选定后优化。</p><main class="grid"><section class="card"><div class="logo"><img src="a-trace.svg" alt="A 溯源节点"></div><h2>A · 溯源节点</h2><small>把 A 字母骨架变成参考节点之间的路径。偏产品工具感，缩小时辨识度强。</small><div class="sizes"><img src="a-trace.svg" alt=""><img src="a-trace.svg" alt=""><img src="a-trace.svg" alt=""></div></section><section class="card"><div class="logo"><img src="b-atlas.svg" alt="B 地图折页"></div><h2>B · 地图折页</h2><small>折页代表 Atlas，贯穿的折线代表从参考到输出的路线。叙事最直接。</small><div class="sizes"><img src="b-atlas.svg" alt=""><img src="b-atlas.svg" alt=""><img src="b-atlas.svg" alt=""></div></section><section class="card"><div class="logo"><img src="c-layers.svg" alt="C 参考叠层"></div><h2>C · 参考叠层</h2><small>叠放的画板承载素材，折线向外延伸。更接近设计工作台的视觉语汇。</small><div class="sizes"><img src="c-layers.svg" alt=""><img src="c-layers.svg" alt=""><img src="c-layers.svg" alt=""></div></section></main></body></html>
